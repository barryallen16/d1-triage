[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d1-triage"
version = "0.1.0"
description = "Triage Java static analysis alerts into verdict, reason and fix"
requires-python = ">=3.10"
dependencies = [
    "javalang>=0.13",
    "numpy",
    "scikit-learn",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
model = ["torch", "transformers", "peft", "bitsandbytes", "unsloth"]
web = ["gradio>=5.0.0"]

[project.scripts]
d1-triage = "d1_triage.cli:main"

[tool.setuptools.packages.find]
include = ["d1_triage*", "triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
